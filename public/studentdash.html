<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | ClassTrack</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Common Theme -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ================= CONTAINER ================= */
    .admin-container {
      max-width: 1100px;
      margin: auto;
      padding: 60px;
    }

    .admin-section {
      margin-top: 60px;
    }

    .admin-section h2 {
      font-size: 26px;
      margin-bottom: 22px;
      color: var(--deep-teal);
    }

    /* ================= FORMS ================= */
    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .admin-form input,
    .admin-form select,
    .admin-form textarea {
      padding: 14px 16px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      font-family: Inter;
    }

    textarea {
      border-radius: 18px;
      resize: none;
      grid-column: span 2;
    }

    .admin-form button {
      grid-column: span 2;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--soft-gold));
      color: var(--deep-teal);
      font-weight: 600;
      cursor: pointer;
    }

    /* ================= EVENTS TABLE (UNCHANGED) ================= */
    .event-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
    }

    .event-table th,
    .event-table td {
      padding: 14px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .event-table th {
      background: #f1f5f9;
      color: var(--deep-teal);
      font-weight: 600;
    }

    /* ================= NOTICES ================= */
    .ads {
      display: grid;
      gap: 16px;
    }

    .ad-card {
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .ad-card h4 {
      color: var(--deep-teal);
      margin-bottom: 4px;
    }

    .ad-card small {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ================= NOTICE MODAL ================= */
    .notice-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .notice-modal-card {
      background: #fff;
      padding: 22px;
      width: 92%;
      max-width: 520px;
      border-radius: 18px;
      position: relative;
    }

    .notice-modal-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .notice-modal-card h3 {
      color: var(--deep-teal);
      margin-bottom: 8px;
    }

    .notice-modal-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .notice-modal-card a {
      font-weight: 600;
      color: var(--dark-teal);
    }

    .notice-close {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .admin-container {
        padding: 30px 16px;
      }
      .admin-form {
        grid-template-columns: 1fr;
      }
      textarea,
      .admin-form button {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div>
    <div class="logo">ClassTrack</div>
    <div class="motto">Student Dashboard</div>
  </div>
</header>

<main class="admin-container">

  <!-- ================= BOOK EVENT (UNCHANGED) ================= -->
  <div class="admin-section">
    <h2>Book an Event</h2>

    <div class="admin-form">
      <input id="title" placeholder="Event Title">
      <input id="club" placeholder="Club Name">
      <select id="venueType">
        <option value="Class">Class</option>
        <option value="Lab">Lab</option>
      </select>
      <input id="venue" placeholder="Class / Lab Name">
      <input type="date" id="date">
      <input type="time" id="start">
      <input type="time" id="end">
      <textarea id="desc" rows="3" placeholder="Event Description"></textarea>
      <button id="submitEventBtn">Submit Event</button>
    </div>
  </div>

  <div class="admin-section">
    <h2>Your Booked Events</h2>
    <table class="event-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Venue</th>
          <th>Date</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="eventBody"></tbody>
    </table>
  </div>

  <!-- ================= POST NOTICE ================= -->
  <div class="admin-section">
    <h2>Post Notice</h2>

    <div class="admin-form">
      <!-- ORIGINAL FIELDS -->
      <input id="adClub" placeholder="Club / Committee Name">
      <input id="adTitle" placeholder="Notice Title">
      <textarea id="adDesc" rows="2" placeholder="Short Description"></textarea>

      <!-- ADDITIONAL FIELDS -->
      <textarea id="adLongDesc" rows="3" placeholder="Detailed Description"></textarea>
      <input type="file" id="adImage" accept="image/*">
      <input id="adLink" placeholder="Registration Link (optional)">

      <button id="postAdBtn">Post Notice</button>
    </div>
  </div>

  <div class="admin-section">
    <h2>Active Notices</h2>
    <div class="ads" id="adsContainer"></div>
  </div>

</main>

<!-- ================= NOTICE MODAL ================= -->
<div class="notice-modal" id="noticeModal">
  <div class="notice-modal-card">
    <span class="notice-close" id="closeModal">&times;</span>
    <img id="modalImg">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <a id="modalLink" target="_blank"></a>
  </div>
</div>

<!-- ================= FIREBASE + NOTICE JS ================= -->
<script type="module">
  /* ================= FIREBASE IMPORTS ================= */
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  /* ================= FIREBASE CONFIG ================= */
  const firebaseConfig = {
  apiKey: "AIzaSyBkTWA1CVjbmiVAlusAiY6VhLTSZj61n6U",
  authDomain: "classtrack-a452f.firebaseapp.com",
  projectId: "classtrack-a452f"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  /* ======================================================
   EVENT BACKEND LOGIC (ADDED — DOES NOT TOUCH OTHER CODE)
====================================================== */

const submitEventBtn = document.getElementById("submitEventBtn");
const eventBody = document.getElementById("eventBody");

/* ---------- ADD EVENT ---------- */
submitEventBtn.addEventListener("click", async () => {
  const title = document.getElementById("title").value.trim();
  const club = document.getElementById("club").value.trim();
  const venueType = document.getElementById("venueType").value;
  const venue = document.getElementById("venue").value.trim();
  const date = document.getElementById("date").value;
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;
  const desc = document.getElementById("desc").value.trim();

  if (!title || !club || !venue || !date || !start || !end) {
    alert("Please fill all required fields");
    return;
  }

  await addDoc(collection(db, "events"), {
    title,
    club,
    venueType,
    venue,
    date,
    start,
    end,
    desc,
    createdAt: serverTimestamp()
  });

  document.getElementById("title").value = "";
  document.getElementById("club").value = "";
  document.getElementById("venue").value = "";
  document.getElementById("date").value = "";
  document.getElementById("start").value = "";
  document.getElementById("end").value = "";
  document.getElementById("desc").value = "";

  loadEvents();
});

/* ---------- LOAD EVENTS ---------- */
async function loadEvents() {
  eventBody.innerHTML = "";
  const snap = await getDocs(collection(db, "events"));

  snap.forEach(d => {
    const e = d.data();
    eventBody.innerHTML += `
      <tr>
        <td>${e.title}</td>
        <td>${e.venueType} ${e.venue}</td>
        <td>${e.date}</td>
        <td>${e.start} - ${e.end}</td>
        <td>
          <button class="delete-btn" data-id="${d.id}">Delete</button>
        </td>
      </tr>
    `;
  });

  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = async () => {
      await deleteDoc(doc(db, "events", btn.dataset.id));
      loadEvents();
    };
  });
}

/* ---------- INITIAL LOAD ---------- */
loadEvents();


  /* ================= DOM REFERENCES ================= */
  const postAdBtn = document.getElementById("postAdBtn");
  const adClub = document.getElementById("adClub");
  const adTitle = document.getElementById("adTitle");
  const adDesc = document.getElementById("adDesc");
  const adLongDesc = document.getElementById("adLongDesc");
  const adImage = document.getElementById("adImage");
  const adLink = document.getElementById("adLink");

  const adsContainer = document.getElementById("adsContainer");

  const noticeModal = document.getElementById("noticeModal");
  const modalImg = document.getElementById("modalImg");
  const modalTitle = document.getElementById("modalTitle");
  const modalDesc = document.getElementById("modalDesc");
  const modalLink = document.getElementById("modalLink");
  const closeModal = document.getElementById("closeModal");

  /* ================= CLOUDINARY UPLOAD ================= */
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "images");

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dy4b6qdju/image/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await res.json();
    return data.secure_url;
  }

  /* ================= EVENTS (UNCHANGED) ================= */
  
  /* ================= LOAD NOTICES ================= */
  async function loadAds() {
    adsContainer.innerHTML = "";
    const snap = await getDocs(collection(db, "student_ads"));

    snap.forEach(d => {
      const n = d.data();
      adsContainer.innerHTML += `
        <div class="ad-card notice-item"
          data-title="${n.title}"
          data-short="${n.shortDesc || ''}"
          data-long="${n.longDesc || ''}"
          data-img="${n.imageUrl || ''}"
          data-link="${n.link || ''}">
          <h4>${n.title}</h4>
          <small>${n.club}</small>
        </div>
      `;
    });

    document.querySelectorAll(".notice-item").forEach(card => {
      card.onclick = () => openModal(card);
    });
  }

  /* ================= POST NOTICE ================= */
  postAdBtn.onclick = async () => {
    try {
      if (!adClub.value || !adTitle.value || !adDesc.value) {
        alert("Please fill required fields");
        return;
      }

      let imageUrl = "";

      if (adImage.files.length > 0) {
        const file = adImage.files[0];

        if (file.size > 2 * 1024 * 1024) {
          alert("Image must be under 2MB");
          return;
        }

        imageUrl = await uploadToCloudinary(file);
      }

      await addDoc(collection(db, "student_ads"), {
        club: adClub.value.trim(),
        title: adTitle.value.trim(),
        shortDesc: adDesc.value.trim(),
        longDesc: adLongDesc.value.trim(),
        imageUrl: imageUrl,
        link: adLink.value.trim(),
        createdAt: serverTimestamp()
      });

      alert("Notice posted successfully!");

      adClub.value = "";
      adTitle.value = "";
      adDesc.value = "";
      adLongDesc.value = "";
      adLink.value = "";
      adImage.value = "";

      loadAds();

    } catch (err) {
      console.error("CLOUDINARY UPLOAD ERROR:", err);
      alert("Failed to post notice");
    }
  };

  /* ================= MODAL ================= */
  function openModal(card) {
    modalTitle.innerText = card.dataset.title;
    modalDesc.innerText = card.dataset.long || card.dataset.short;

    modalImg.src = card.dataset.img
      ? card.dataset.img
      : "https://via.placeholder.com/400x250?text=Notice";

    if (card.dataset.link) {
      modalLink.href = card.dataset.link;
      modalLink.innerText = "Open Registration Link";
      modalLink.style.display = "inline";
    } else {
      modalLink.style.display = "none";
    }

    noticeModal.style.display = "flex";
  }

  closeModal.onclick = () => {
    noticeModal.style.display = "none";
  };

  /* ================= INITIAL LOAD ================= */
  loadEvents();
  loadAds();
</script>


</body>
</html>

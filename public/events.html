  <!-- Theme -->
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="events.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">

  <!-- TOP ROW -->
  <div class="nav-top">

    <!-- LEFT -->

      <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div>
        <div class="logo">ClassTrack</div>
        <div class="motto">Smart Community</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="nav-actions">
      <button class="logout-btn">Logout</button>
    </div>

  </div>

  <!-- NAV LINKS -->
  <nav class="nav-menu" id="navMenu">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="class.html"><i class="fa-solid fa-book"></i> Class</a>
    <a href="lab.html"><i class="fa-solid fa-flask"></i> Lab</a>

    <a href="events.html" class="active">
      <i class="fa-solid fa-calendar-days"></i> Events
    </a>
  </nav>

</header>

<!-- ================= CONTENT ================= -->
<div class="page-container">

  <div class="page-header">
    <h1>Campus Events</h1>
    <p>Upcoming & ongoing club activities</p>
  </div>

  <section class="section">
    <h2>Upcoming Events</h2>
    <div class="cards" id="upcomingEvents"></div>
  </section>

  <section class="section">
    <h2>Ongoing Events</h2>
    <div class="cards" id="ongoingEvents"></div>
  </section>

</div>

<!-- ================= SCRIPTS ================= -->
<script type="module">
  /* HAMBURGER */
  const menuToggle = document.getElementById("menuToggle");
  const navMenu = document.getElementById("navMenu");

  menuToggle.onclick = () => {
    navMenu.classList.toggle("active");
  };

  /* FIREBASE */
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyBkTWA1CVjbmiVAlusAiY6VhLTSZj61n6U",
  authDomain: "classtrack-a452f.firebaseapp.com",
  projectId: "classtrack-a452f"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const upcoming = document.getElementById("upcomingEvents");
  const ongoing = document.getElementById("ongoingEvents");

  const now = new Date();
  const today = now.toISOString().split("T")[0];
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const toMinutes = t => {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  };

  async function loadEvents() {
    upcoming.innerHTML = "";
    ongoing.innerHTML = "";

    const snap = await getDocs(collection(db, "events"));

    snap.forEach(d => {
      const e = d.data();
      if (!e.date || !e.start || !e.end) return;

      const start = toMinutes(e.start);
      const end = toMinutes(e.end);

      let status;
      if (e.date > today) status = "upcoming";
      else if (e.date === today && currentMinutes >= start && currentMinutes <= end)
        status = "ongoing";
      else return;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <h3>${e.title}</h3>
          <p><strong>${e.club}</strong></p>
          <p>${e.venueType}: ${e.venue}</p>
          <p>${e.date} • ${e.start} - ${e.end}</p>
        </div>
        <span class="status ${status === "upcoming" ? "available" : "occupied"}">
          ${status === "upcoming" ? "Upcoming" : "Ongoing"}
        </span>
      `;

      status === "upcoming"
        ? upcoming.appendChild(card)
        : ongoing.appendChild(card);
    });
  }

  loadEvents();
</script>

</body>
</html>

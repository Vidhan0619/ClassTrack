<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ClassTrack</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">

  <style>
    /* ================= LOGIN CARD ================= */
    .login-card {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.12);
    }

    /* ================= ROLE SELECT ================= */
    .role-select {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .role-select button {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .role-select button.active {
      background: rgba(24,143,139,0.15);
      color: var(--deep-teal);
    }

    /* ================= INPUTS ================= */
    .login-card input {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      margin-bottom: 14px;
      font-size: 14px;
    }

    /* ================= LOGIN BUTTON ================= */
    .login-card button.login {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--soft-gold));
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    /* ================= MOBILE RESPONSIVE ================= */
    @media (max-width: 600px) {

      .page-header h1 {
        font-size: 24px;
      }

      .page-header p {
        font-size: 14px;
      }

      .login-card {
        padding: 22px;
        border-radius: 16px;
      }

      .role-select {
        flex-direction: column;
        gap: 10px;
      }

      .role-select button {
        padding: 12px;
        font-size: 14px;
      }

      .login-card input {
        padding: 12px;
        font-size: 14px;
      }

      .login-card button.login {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div>
    <div class="logo">ClassTrack</div>
    <div class="motto">Login Portal</div>
  </div>
</header>

<main class="page-container">
  <div class="page-header">
    <h1>Login</h1>
    <p>Select role to continue</p>
  </div>

  <div class="login-card">

    <div class="role-select">
      <button id="facultyBtn" class="active">Faculty</button>
      <button id="studentBtn">Student</button>
    </div>

    <input type="text" id="userId" placeholder="User ID">
    <input type="password" id="password" placeholder="Password">

    <button class="login" id="loginBtn">Login</button>

    <div class="error" id="errorMsg"></div>
  </div>
</main>

<script>
  let role = "faculty";

  const facultyCreds = {
    admin01: "admin@123",
    admin02: "class@track"
  };

  const studentCreds = {
    student01: "student@123",
    student02: "event@book"
  };

  facultyBtn.onclick = () => {
    role = "faculty";
    facultyBtn.classList.add("active");
    studentBtn.classList.remove("active");
  };

  studentBtn.onclick = () => {
    role = "student";
    studentBtn.classList.add("active");
    facultyBtn.classList.remove("active");
  };

  loginBtn.onclick = () => {
    const id = userId.value.trim();
    const pass = password.value.trim();
    errorMsg.innerText = "";

    if (role === "faculty") {
      if (facultyCreds[id] === pass) {
        sessionStorage.setItem("role", "faculty");
        location.href = "admindash.html";
      } else {
        errorMsg.innerText = "Invalid faculty credentials";
      }
    }

    if (role === "student") {
      if (studentCreds[id] === pass) {
        sessionStorage.setItem("role", "student");
        location.href = "studentdash.html";
      } else {
        errorMsg.innerText = "Invalid student credentials";
      }
    }
  };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | ClassTrack</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Common Theme -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ================= CONTAINER ================= */
    .admin-container {
      max-width: 1100px;
      margin: auto;
      padding: 60px;
    }

    .admin-section {
      margin-top: 60px;
    }

    .admin-section h2 {
      font-size: 26px;
      margin-bottom: 22px;
      color: var(--deep-teal);
    }

    /* ================= FORMS ================= */
    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .admin-form input,
    .admin-form select,
    .admin-form textarea {
      padding: 14px 16px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      font-family: Inter;
    }

    textarea {
      border-radius: 18px;
      resize: none;
      grid-column: span 2;
    }

    .admin-form button {
      grid-column: span 2;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--soft-gold));
      color: var(--deep-teal);
      font-weight: 600;
      cursor: pointer;
    }

    /* ================= EVENTS TABLE ================= */
    .event-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
    }

    .event-table th,
    .event-table td {
      padding: 14px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .event-table th {
      background: #f1f5f9;
      color: var(--deep-teal);
      font-weight: 600;
    }

    /* ================= ADS ================= */
    .ads {
      display: grid;
      gap: 16px;
    }

    .ad-card {
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
    }

    .ad-card h4 {
      color: var(--deep-teal);
      margin-bottom: 4px;
    }

    .ad-card small {
      color: var(--text-muted);
      font-weight: 600;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #b91c1c;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .admin-container {
        padding: 30px 16px;
      }
      .admin-form {
        grid-template-columns: 1fr;
      }
      textarea,
      .admin-form button {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div>
    <div class="logo">ClassTrack</div>
    <div class="motto">Student Dashboard</div>
  </div>
</header>

<main class="admin-container">

  <!-- ================= BOOK EVENT ================= -->
  <div class="admin-section">
    <h2>Book an Event</h2>

    <div class="admin-form">
      <input id="title" placeholder="Event Title">
      <input id="club" placeholder="Club Name">
      <select id="venueType">
        <option value="Class">Class</option>
        <option value="Lab">Lab</option>
      </select>
      <input id="venue" placeholder="Class / Lab Name">
      <input type="date" id="date">
      <input type="time" id="start">
      <input type="time" id="end">
      <textarea id="desc" rows="3" placeholder="Event Description"></textarea>
      <button id="submitEventBtn">Submit Event</button>
    </div>
  </div>

  <div class="admin-section">
    <h2>Your Booked Events</h2>
    <table class="event-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Venue</th>
          <th>Date</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="eventBody"></tbody>
    </table>
  </div>

  <!-- ================= POST ADVERTISEMENT ================= -->
  <div class="admin-section">
    <h2>Post Advertisement</h2>

    <div class="admin-form">
      <input id="adClub" placeholder="Club / Committee Name">
      <input id="adTitle" placeholder="Advertisement Title">
      <textarea id="adDesc" rows="3" placeholder="Advertisement Description"></textarea>
      <button id="postAdBtn">Post Advertisement</button>
    </div>
  </div>

  <div class="admin-section">
    <h2>Active Advertisements</h2>
    <div class="ads" id="adsContainer"></div>
  </div>

</main>

<!-- ================= FIRESTORE + POPUP JS ================= -->
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLz8zqZUaHaHBIhccjHdCtCFcEzs3HVhY",
    authDomain: "classtrack-87c00.firebaseapp.com",
    projectId: "classtrack-87c00"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const eventBody = document.getElementById("eventBody");
  const adsContainer = document.getElementById("adsContainer");

  /* ================= EVENTS ================= */
  async function loadEvents() {
    eventBody.innerHTML = "";
    const snap = await getDocs(collection(db, "events"));

    snap.forEach(d => {
      const e = d.data();
      eventBody.innerHTML += `
        <tr>
          <td>${e.title}</td>
          <td>${e.venueType} ${e.venue}</td>
          <td>${e.date}</td>
          <td>${e.start} - ${e.end}</td>
          <td>
            <button class="delete-btn" data-id="${d.id}">Delete</button>
          </td>
        </tr>
      `;
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Are you sure you want to delete this event?")) return;
        await deleteDoc(doc(db, "events", btn.dataset.id));
        alert("Event deleted successfully");
        loadEvents();
      };
    });
  }

  document.getElementById("submitEventBtn").onclick = async () => {
    if (!title.value || !club.value || !venue.value || !date.value || !start.value || !end.value) {
      alert("Please fill all event details");
      return;
    }

    try {
      await addDoc(collection(db, "events"), {
        title: title.value,
        club: club.value,
        venueType: venueType.value,
        venue: venue.value,
        date: date.value,
        start: start.value,
        end: end.value,
        description: desc.value,
        createdAt: serverTimestamp()
      });

      alert("Event booked successfully!");
      [title, club, venue, date, start, end, desc].forEach(i => i.value = "");
      loadEvents();

    } catch (err) {
      alert("Error booking event");
      console.error(err);
    }
  };

  /* ================= ADS ================= */
  async function loadAds() {
    adsContainer.innerHTML = "";
    const snap = await getDocs(collection(db, "student_ads"));

    snap.forEach(d => {
      const ad = d.data();
      adsContainer.innerHTML += `
        <div class="ad-card">
          <h4>${ad.title}</h4>
          <small>${ad.club}</small>
          <p>${ad.description}</p>
          <button class="delete-btn" data-id="${d.id}">Delete</button>
        </div>
      `;
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Delete this advertisement?")) return;
        await deleteDoc(doc(db, "student_ads", btn.dataset.id));
        alert("Advertisement deleted");
        loadAds();
      };
    });
  }

  document.getElementById("postAdBtn").onclick = async () => {
    if (!adClub.value || !adTitle.value || !adDesc.value) {
      alert("Please fill all advertisement fields");
      return;
    }

    try {
      await addDoc(collection(db, "student_ads"), {
        club: adClub.value,
        title: adTitle.value,
        description: adDesc.value,
        createdAt: serverTimestamp()
      });

      alert("Advertisement posted successfully!");
      adClub.value = adTitle.value = adDesc.value = "";
      loadAds();

    } catch (err) {
      alert("Error posting advertisement");
      console.error(err);
    }
  };

  loadEvents();
  loadAds();
</script>

</body>
</html>

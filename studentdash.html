<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Event | ClassTrack</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Common Theme -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ================= CONTAINER ================= */
    .admin-container {
      max-width: 1100px;
      margin: auto;
      padding: 60px;
    }

    .admin-section {
      margin-top: 60px;
    }

    .admin-section h2 {
      font-size: 26px;
      margin-bottom: 22px;
      color: var(--deep-teal);
    }

    /* ================= FORM ================= */
    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .admin-form input,
    .admin-form select,
    .admin-form textarea {
      padding: 14px 16px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      font-family: Inter;
    }

    textarea {
      border-radius: 18px;
      grid-column: span 2;
      resize: none;
    }

    .admin-form button {
      grid-column: span 2;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--soft-gold));
      color: var(--deep-teal);
      font-weight: 600;
      cursor: pointer;
    }

    /* ================= DESKTOP TABLE ================= */
    .event-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
    }

    .event-table th,
    .event-table td {
      padding: 14px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .event-table th {
      background: #f1f5f9;
      color: var(--deep-teal);
      font-weight: 600;
    }

    /* ================= MOBILE CARDS ================= */
    .event-cards {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.1);
    }

    .event-card h4 {
      font-size: 16px;
      color: var(--deep-teal);
      margin-bottom: 6px;
    }

    .event-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ================= BUTTONS ================= */
    .delete-btn {
      background: transparent;
      border: none;
      color: #b91c1c;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* ================= NAVBAR ================= */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--deep-teal);
      cursor: pointer;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {

      .menu-toggle {
        display: block;
      }

      .navbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px;
      }

      .nav-menu {
        display: none;
        width: 100%;
        flex-direction: column;
        background: #fff;
        margin-top: 14px;
        padding: 14px;
        gap: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      }

      .nav-menu.active {
        display: flex;
      }

      .admin-container {
        padding: 30px 16px;
      }

      .admin-form {
        grid-template-columns: 1fr;
      }

      textarea {
        grid-column: span 1;
      }

      .admin-form button {
        grid-column: span 1;
        width: 100%;
      }

      /* SWITCH LAYOUT */
      .event-table {
        display: none;
      }

      .event-cards {
        display: flex;
      }
    }
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="nav-left">
    <button class="menu-toggle" id="menuToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div>
      <div class="logo">ClassTrack</div>
      <div class="motto">Student Event Booking</div>
    </div>
  </div>

  <nav class="nav-menu" id="navMenu">
    <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
    <a href="admin.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </nav>
</header>

<main class="admin-container">

  <div class="page-header">
    <h1>Book an Event</h1>
    <p>Submit and manage your events</p>
  </div>

  <!-- BOOK EVENT -->
  <div class="admin-section">
    <h2>New Event</h2>

    <div class="admin-form">
      <input id="title" placeholder="Event Title">
      <input id="club" placeholder="Club Name">
      <select id="venueType">
        <option value="Class">Class</option>
        <option value="Lab">Lab</option>
      </select>
      <input id="venue" placeholder="Class / Lab Name">
      <input type="date" id="date">
      <input type="time" id="start">
      <input type="time" id="end">
      <textarea id="desc" rows="3" placeholder="Event Description"></textarea>
      <button id="submitBtn">Submit Event</button>
    </div>
  </div>

  <!-- BOOKED EVENTS -->
  <div class="admin-section">
    <h2>Your Booked Events</h2>

    <!-- DESKTOP TABLE -->
    <table class="event-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Venue</th>
          <th>Date</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="eventBody"></tbody>
    </table>

    <!-- MOBILE CARDS -->
    <div class="event-cards" id="eventCards"></div>
  </div>

</main>

<!-- ================= SCRIPT ================= -->
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLz8zqZUaHaHBIhccjHdCtCFcEzs3HVhY",
    authDomain: "classtrack-87c00.firebaseapp.com",
    projectId: "classtrack-87c00"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const eventBody = document.getElementById("eventBody");
  const eventCards = document.getElementById("eventCards");

  const submitBtn = document.getElementById("submitBtn");
  const titleEl = document.getElementById("title");
  const clubEl = document.getElementById("club");
  const venueTypeEl = document.getElementById("venueType");
  const venueEl = document.getElementById("venue");
  const dateEl = document.getElementById("date");
  const startEl = document.getElementById("start");
  const endEl = document.getElementById("end");
  const descEl = document.getElementById("desc");

  async function loadEvents() {
    eventBody.innerHTML = "";
    eventCards.innerHTML = "";

    const snap = await getDocs(collection(db, "events"));

    snap.forEach(d => {
      const e = d.data();

      // DESKTOP ROW
      eventBody.innerHTML += `
        <tr>
          <td>${e.title}</td>
          <td>${e.venueType} ${e.venue}</td>
          <td>${e.date}</td>
          <td>${e.start} - ${e.end}</td>
          <td>
            <button class="delete-btn" data-id="${d.id}">Delete</button>
          </td>
        </tr>
      `;

      // MOBILE CARD
      eventCards.innerHTML += `
        <div class="event-card">
          <h4>${e.title}</h4>
          <p><strong>Venue:</strong> ${e.venueType} ${e.venue}</p>
          <p><strong>Date:</strong> ${e.date}</p>
          <p><strong>Time:</strong> ${e.start} - ${e.end}</p>
          <button class="delete-btn" data-id="${d.id}">Delete</button>
        </div>
      `;
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Delete this event?")) return;
        await deleteDoc(doc(db, "events", btn.dataset.id));
        loadEvents();
      };
    });
  }

  submitBtn.onclick = async () => {
    if (!titleEl.value || !clubEl.value || !venueEl.value ||
        !dateEl.value || !startEl.value || !endEl.value) {
      alert("Please fill all fields");
      return;
    }

    await addDoc(collection(db, "events"), {
      title: titleEl.value,
      club: clubEl.value,
      venueType: venueTypeEl.value,
      venue: venueEl.value,
      date: dateEl.value,
      start: startEl.value,
      end: endEl.value,
      description: descEl.value,
      createdAt: serverTimestamp()
    });

    [titleEl, clubEl, venueEl, dateEl, startEl, endEl, descEl]
      .forEach(i => i.value = "");

    loadEvents();
  };

  loadEvents();

  // HAMBURGER
  document.getElementById("menuToggle").onclick = () => {
    document.getElementById("navMenu").classList.toggle("active");
  };
</script>

</body>
</html>
